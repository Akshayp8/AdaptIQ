[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "adaptiq"
version = "1.0.0"
description = "AdaptIQ — Intelligent Adaptive AI Learning Engine with Fuzzy Logic & Bayesian Knowledge Tracing"
authors = [
    { name = "Akshay Patil", email = "ap446370@gmail.com" }
]
license = { text = "MIT" }
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "streamlit>=1.35.0",
    "scikit-fuzzy>=0.4.2",
    "scikit-learn>=1.4.0",
    "pandas>=2.1.0",
    "matplotlib>=3.8.0",
    "numpy>=1.26.0",
    "scipy>=1.12.0",
    "networkx>=3.2.0",
    "joblib>=1.3.0",
]

[tool.setuptools.packages.find]
where = ["src"]
